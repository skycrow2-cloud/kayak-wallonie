name: Sonde des sources
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Étapes (lu,fr,vl,osm)'
        default: 'lu,fr,vl,osm'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs
        env:
          PROBE: ${{ inputs.probe }}
