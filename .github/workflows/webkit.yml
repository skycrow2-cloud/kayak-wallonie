name: Test Safari (WebKit)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['test/webkit/**', '.github/workflows/webkit.yml']
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright && npx playwright install --with-deps webkit
      - run: mkdir -p test/out shots && node test/mock-run.mjs > /dev/null
      - run: (cd site && python3 -m http.server 8765 &) && sleep 2 && node test/webkit/rot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: captures-safari, path: shots }
