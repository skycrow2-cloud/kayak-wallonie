<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kayak Wallonie</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#17302B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
  --ink:#17302B; --mist:#EEF2EF; --paper:#FBFCFB; --river:#2F6F73; --line:#C9D3CF; --soft:#5B6E69;
  --open:#1F8A5B; --closed:#8A8F93; --risk:#C98A12; --maybe:#3C7FB5; --high:#7A4FA0;
  --display:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--mist);color:var(--ink);font:16px/1.45 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--maybe);outline-offset:2px}
.app{display:grid;height:100dvh;grid-template-rows:auto 42dvh 1fr}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--ink);color:var(--paper);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font:700 26px/1 var(--display);margin:0;letter-spacing:.01em}
header .maj{font-size:13px;opacity:.75;margin-left:auto}
#map{background:#dfe7e3}
.panel{overflow:auto;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.filters{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:8px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.summary{padding:12px 16px 4px;font:600 20px/1.2 var(--display);margin:0}
.notice{margin:8px 16px;padding:10px 12px;background:#fff6e0;border-left:4px solid var(--risk);font-size:14px}
ul.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:hover{background:var(--mist)}
.row .name{font:600 21px/1.1 var(--display)}
.row .sub{font-size:14px;color:var(--soft);grid-column:1/-1}
.row .gauge{grid-column:1/-1;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 15px/1 var(--display);padding:5px 9px;border-radius:4px;color:#fff;letter-spacing:.02em}
.b-ouvert{background:var(--open)} .b-ferme{background:var(--closed)} .b-risque{background:var(--risk)} .b-possible{background:var(--maybe)} .b-saison{background:#B5BBB8;color:var(--ink)}
.star{background:none;border:0;font-size:20px;cursor:pointer;padding:2px 4px;color:var(--soft)}
.star[aria-pressed=true]{color:var(--risk)}

/* Jauge de débit : la fenêtre navigable min–max est la bande d'eau */
.gauge{position:relative;height:30px}
.gauge .track{position:absolute;left:0;right:0;top:10px;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#D9DFDC 0 6px,#E6EBE8 6px 12px)}
.gauge .band{position:absolute;top:10px;height:10px;background:linear-gradient(180deg,#4F9A9E,var(--river));border-radius:2px}
.gauge .mark{position:absolute;top:2px;width:4px;height:26px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--paper)}
.gauge .lab{position:absolute;top:21px;font-size:11px;color:var(--soft);transform:translateX(-50%);white-space:nowrap}
.gauge.big{height:48px}
.gauge.big .track,.gauge.big .band{top:14px;height:16px}
.gauge.big .mark{top:4px;height:36px;width:5px}
.gauge.big .lab{top:33px;font-size:12px}

/* Fiche */
.sheet{position:fixed;inset:0;z-index:1000;background:var(--paper);overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .top{position:sticky;top:0;background:var(--ink);color:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 14px;z-index:2}
.sheet .back{background:none;border:0;color:var(--paper);font-size:15px;padding:4px 0;cursor:pointer;opacity:.85}
.sheet h2{font:700 32px/1 var(--display);margin:6px 0 4px}
.sheet .where{font-size:15px;opacity:.85;margin:0}
.sheet section{padding:16px;border-bottom:1px solid var(--line)}
.sheet h3{font:600 20px/1.1 var(--display);margin:0 0 10px}
.big-q{font:700 44px/1 var(--display)}
.big-q small{font-size:18px;font-weight:500;color:var(--soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.facts div{font-size:14px;color:var(--soft)} .facts b{display:block;font:600 20px/1.1 var(--display);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.day{padding:8px 4px;border-radius:6px;background:var(--mist)}
.day .d{font-size:13px;color:var(--soft)} .day .i{font-size:24px;line-height:1.3} .day .r{font:600 18px/1 var(--display)}
.outlook{margin-top:12px;padding:12px;border-radius:6px;border-left:5px solid var(--maybe);background:#EAF1F7}
.outlook.o-ouvert{border-color:var(--open);background:#E5F3EC}.outlook.o-ferme{border-color:var(--closed);background:#EFF0F0}.outlook.o-risque{border-color:var(--risk);background:#FBF1DC}
.aire{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.aire:first-of-type{border-top:0}
.aire .t{flex:none;width:34px;text-align:center;font:700 14px/26px var(--display);border-radius:4px;background:var(--mist)}
.aire .n{flex:1;font-size:15px} .aire .n small{display:block;color:var(--soft);font-size:13px;white-space:pre-line}
.aire a{flex:none;font-size:14px;color:var(--river);font-weight:700}
.desc{white-space:pre-line;font-size:15px;max-width:68ch}
.desc.short{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.link{color:var(--river);font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
svg.spark{width:100%;height:110px;display:block}
.alert-box{font-size:15px}
.btn{display:inline-block;background:var(--river);color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}
.leaflet-container{font:inherit}
.lbl{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font:600 13px var(--display);white-space:nowrap;box-shadow:none}
.lbl:before{display:none}

@media (min-width:900px){
  .app{grid-template-columns:420px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:1/-1}
  #map{grid-column:2;grid-row:2}
  .panel{grid-column:1;grid-row:2;border-top:0;border-right:1px solid var(--line)}
  .sheet{inset:auto;top:var(--hh,48px);left:0;bottom:0;width:420px;transform:translateX(-100%);box-shadow:4px 0 16px rgba(23,48,43,.15)}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Kayak Wallonie</h1><span class="maj" id="maj">Chargement…</span></header>
  <div id="map" role="region" aria-label="Carte des parcours"></div>
  <div class="panel">
    <div class="filters" role="toolbar" aria-label="Filtres">
      <button class="chip" data-f="ouvert" aria-pressed="false">Ouverts</button>
      <button class="chip" data-f="fav" aria-pressed="false">Mes rivières</button>
      <button class="chip" data-f="pres" aria-pressed="false">Près de moi</button>
    </div>
    <p class="summary" id="summary"></p>
    <div id="notices"></div>
    <ul class="list" id="list"></ul>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
let DATA = null, me = null, favs = new Set(store.get('favs', [])), filters = new Set(store.get('filters', []));
const COLORS = { ouvert:'#1F8A5B', ferme:'#8A8F93', risque:'#C98A12', possible:'#3C7FB5', saison:'#B5BBB8' };
const fmt = n => n == null ? '–' : new Intl.NumberFormat('fr-BE', { maximumFractionDigits: n < 10 ? 2 : n < 100 ? 1 : 0 }).format(n);

function state(t){
  if (!t.saison) return { k:'saison', label:'Hors saison' };
  if (t.ouvert) return t.prevision?.niveau === 'risque' ? { k:'risque', label:'Ouvert, à surveiller' } : { k:'ouvert', label:'Ouvert' };
  if (t.prevision?.niveau === 'possible') return { k:'possible', label:'Fermé, ouverture possible' };
  return { k:'ferme', label:'Fermé' };
}
function reason(t){
  if (!t.saison) return 'Autorisé du 1er octobre au 15 mars';
  if (t.ouvert) return null;
  if (t.debit != null && t.min && t.debit < t.min) return 'Pas assez d’eau';
  if (t.debit != null && t.max && t.debit > t.max) return 'Trop d’eau';
  return t.justif || 'Circulation interdite aujourd’hui';
}

// Jauge sur échelle log : la bande = fenêtre autorisée
function gauge(t, big){
  if (t.debit == null || !t.min) return '';
  const lo = Math.min(t.debit, t.min) / 2, hi = Math.max(t.debit, t.max || t.min * 4) * 1.3;
  const x = v => (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * 100;
  const a = x(t.min), b = t.max ? x(t.max) : 100, m = Math.max(1, Math.min(99, x(t.debit)));
  return `<div class="gauge${big ? ' big' : ''}" role="img" aria-label="Débit ${fmt(t.debit)} m³/s, plage autorisée ${fmt(t.min)} à ${fmt(t.max)} m³/s">
    <div class="track"></div><div class="band" style="left:${a}%;width:${b - a}%"></div>
    <div class="mark" style="left:${m}%"></div>
    <span class="lab" style="left:${a}%">min ${fmt(t.min)}</span>${t.max ? `<span class="lab" style="left:${Math.min(b, 92)}%">max ${fmt(t.max)}</span>` : ''}
  </div>`;
}

function spark(t){
  const s = t.serie || []; if (s.length < 3) return '<p>Pas de mesures horaires disponibles.</p>';
  const W = 600, H = 110, P = 6, vals = s.map(p => p[1]);
  const lo = Math.min(...vals, t.min ?? Infinity) * .9, hi = Math.max(...vals, Math.min(t.max ?? 0, Math.max(...vals) * 2), t.min ?? 0) * 1.08;
  const X = i => P + i / (s.length - 1) * (W - 2 * P), Y = v => H - P - (v - lo) / (hi - lo || 1) * (H - 2 * P);
  const path = s.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const minY = t.min != null && t.min <= hi ? Y(t.min) : null, maxY = t.max != null && t.max <= hi ? Y(t.max) : null;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Débit des 7 derniers jours">
    ${minY != null ? `<rect x="0" y="${maxY ?? 0}" width="${W}" height="${minY - (maxY ?? 0)}" fill="#2F6F73" opacity=".10"/><line x1="0" x2="${W}" y1="${minY}" y2="${minY}" stroke="#2F6F73" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${path} L${X(s.length - 1)} ${H} L${X(0)} ${H}Z" fill="#2F6F73" opacity=".18"/>
    <path d="${path}" fill="none" stroke="#17302B" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  </svg>
  <p style="margin:6px 0 0;font-size:13px;color:var(--soft)">7 derniers jours. Zone teintée : plage autorisée (pointillé = minimum ${fmt(t.min)} m³/s).</p>`;
}

const WX = c => c == null ? '·' : c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : '⛈️';
const dayName = d => { const t = new Date().toISOString().slice(0, 10); return d === t ? 'Auj.' : new Date(d + 'T12:00').toLocaleDateString('fr-BE', { weekday:'short' }); };

function distKm(a, b){ const R = 6371, r = Math.PI/180, dl = (b[0]-a[0])*r, dn = (b[1]-a[1])*r; return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2)); }
const start = t => { const a = t.aires.find(x => x.type === 'E' || x.type === 'ED'); return a ? [a.lat, a.lon] : t.lignes?.[0]?.[0]; };

// ---------- Carte ----------
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([50.05, 5.35], 8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);
const layers = {};

function drawMap(){
  for (const t of DATA.troncons){
    const st = state(t), col = COLORS[st.k];
    const grp = L.featureGroup().addTo(map);
    if (t.lignes?.length){
      L.polyline(t.lignes, { color:'#fff', weight:9, opacity:.9 }).addTo(grp);
      L.polyline(t.lignes, { color:col, weight:5, opacity:1 }).addTo(grp);
    }
    for (const a of t.aires) if (a.type !== 'NA')
      L.circleMarker([a.lat, a.lon], { radius:4, color:'#17302B', weight:1.5, fillColor:'#fff', fillOpacity:1 }).bindTooltip(esc(a.nom)).addTo(grp);
    grp.on('click', () => openSheet(t.id));
    const s = start(t);
    if (s) L.tooltip({ permanent:true, direction:'right', className:'lbl', offset:[6, 0] }).setLatLng(s).setContent(esc(t.riviere)).addTo(grp);
    layers[t.id] = grp;
  }
}

// ---------- Liste ----------
function render(){
  const ts = DATA.troncons.slice();
  let shown = ts.filter(t => (!filters.has('ouvert') || t.ouvert) && (!filters.has('fav') || favs.has(t.id)));
  if (filters.has('pres') && me) shown.forEach(t => t._d = start(t) ? distKm(me, start(t)) : 9999);
  const order = { ouvert:0, risque:1, possible:2, ferme:3, saison:4 };
  shown.sort((a, b) => filters.has('pres') && me ? a._d - b._d : (order[state(a).k] - order[state(b).k]) || a.riviere.localeCompare(b.riviere));
  const nOpen = ts.filter(t => t.ouvert).length;
  $('#summary').textContent = nOpen === 0 ? 'Aucun parcours ouvert aujourd’hui' : nOpen === 1 ? '1 parcours ouvert aujourd’hui' : `${nOpen} parcours ouverts aujourd’hui`;
  $('#list').innerHTML = shown.length ? shown.map(t => {
    const st = state(t), r = reason(t);
    return `<li class="row" data-id="${esc(t.id)}" tabindex="0">
      <div class="name">${esc(t.riviere)} ${favs.has(t.id) ? '<span aria-label="suivie">★</span>' : ''}</div>
      <span class="badge b-${st.k}">${st.label}</span>
      <div class="sub">${esc(shortName(t))}${t.longueurKm ? ` · ${fmt(t.longueurKm)} km` : ''}${t._d != null && filters.has('pres') ? ` · à ${Math.round(t._d)} km` : ''}${r ? `<br>${esc(r)}` : ''}</div>
      ${gauge(t)}
    </li>`; }).join('') : `<li class="row"><div class="sub">Rien à afficher avec ces filtres. ${filters.has('fav') ? 'Ajoutez des rivières avec ☆ dans leur fiche.' : ''}</div></li>`;
  for (const [id, g] of Object.entries(layers)) shown.some(t => t.id === id) ? g.addTo(map) : g.remove();
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', filters.has(c.dataset.f)));
}
const shortName = t => t.nom.replace(/^(La|Le|L')\s?[^,]*?(,\s*|\s(?=de |entre |en aval|du |à ))/i, '').replace(/^./, c => c.toUpperCase());

$('#list').addEventListener('click', e => { const r = e.target.closest('.row[data-id]'); if (r) openSheet(r.dataset.id); });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter'){ const r = e.target.closest('.row[data-id]'); if (r) openSheet(r.dataset.id); } });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const f = c.dataset.f;
  if (filters.has(f)) filters.delete(f); else filters.add(f);
  if (f === 'pres' && filters.has('pres') && !me){
    navigator.geolocation?.getCurrentPosition(p => { me = [p.coords.latitude, p.coords.longitude]; L.circleMarker(me, { radius:7, color:'#fff', weight:3, fillColor:'#3C7FB5', fillOpacity:1 }).addTo(map); render(); },
      () => { filters.delete('pres'); render(); $('#notices').innerHTML = '<div class="notice">Position indisponible : autorisez la localisation pour trier par distance.</div>'; });
  }
  store.set('filters', [...filters].filter(x => x !== 'pres')); render();
}));

// ---------- Fiche ----------
function openSheet(id, push = true){
  const t = DATA.troncons.find(x => x.id === id); if (!t) return;
  const st = state(t), r = reason(t), sh = $('#sheet');
  const today = new Date().toISOString().slice(0, 10);
  const days = (t.meteo || []).filter(d => d.date >= today).slice(0, 4);
  const pr = t.prevision || {};
  const nav = (a) => `https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lon}`;
  const typ = { ED:'E/D', E:'E', D:'D', NA:'✕' };
  const typLong = { ED:'Embarquement et débarquement', E:'Embarquement', D:'Débarquement', NA:'Accès interdit' };
  sh.innerHTML = `
  <div class="top">
    <button class="back" id="close">‹ Tous les parcours</button>
    <h2 id="s-title">${esc(t.riviere)}</h2>
    <p class="where">${esc(t.nom)}</p>
  </div>
  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span class="badge b-${st.k}" style="font-size:18px">${st.label}</span>
      <button class="star" id="fav" aria-pressed="${favs.has(t.id)}" aria-label="Suivre cette rivière">${favs.has(t.id) ? '★ Suivie' : '☆ Suivre'}</button>
    </div>
    ${r ? `<p style="margin:10px 0 0">${esc(r)}</p>` : ''}
    <p class="big-q" style="margin:14px 0 4px">${fmt(t.debit)} <small>m³/s</small></p>
    <p style="margin:0 0 8px;font-size:14px;color:var(--soft)">Débit ${t.debitHeure ? 'mesuré le ' + esc(t.debitHeure.slice(8,10) + '/' + t.debitHeure.slice(5,7) + ' à ' + t.debitHeure.slice(11,16)) : 'officiel du ' + esc(t.officiel?.date || '?')} · station ${esc(t.station?.nom || t.station?.code)}</p>
    ${gauge(t, true)}
  </section>
  <section>
    <h3>Les prochains jours</h3>
    ${days.length ? `<div class="days">${days.map(d => `<div class="day"><div class="d">${dayName(d.date)}</div><div class="i" aria-hidden="true">${WX(d.code)}</div><div class="r">${d.pluie == null ? '–' : fmt(d.pluie) + ' mm'}</div><div class="d">${d.tmax != null ? Math.round(d.tmax) + '°' : ''}</div></div>`).join('')}</div>` : '<p>Météo indisponible.</p>'}
    <div class="outlook o-${esc(pr.niveau)}"><b>${esc(pr.texte || 'Pas de prévision')}</b><br><span style="font-size:13px;color:var(--soft)">Estimation basée sur le débit, sa tendance et la pluie prévue. Seul l’affichage officiel du jour fait foi.</span></div>
  </section>
  <section>
    <h3>Débit sur 7 jours</h3>
    ${spark(t)}
  </section>
  <section>
    <h3>Le parcours</h3>
    <div class="facts">
      ${t.longueurKm ? `<div><b>${fmt(t.longueurKm)} km</b>longueur approx.</div>` : ''}
      ${t.difficulte ? `<div><b>${esc(t.difficulte)}</b>difficulté</div>` : ''}
      <div><b>${t.annexe === '1C' ? '1/10 – 15/3' : 'Toute l’année'}</b>période autorisée</div>
      <div><b>${fmt(t.min)} – ${fmt(t.max)}</b>débits autorisés (m³/s)</div>
    </div>
  </section>
  <section>
    <h3>Embarquer et débarquer</h3>
    ${t.aires.length ? t.aires.map(a => `<div class="aire"><span class="t" title="${typLong[a.type] || ''}">${typ[a.type] || esc(a.type)}</span><div class="n">${esc(a.nom)}<small>${esc(typLong[a.type] || '')}${a.info ? ' · ' + esc(a.info) : ''}</small></div>${a.type !== 'NA' ? `<a href="${nav(a)}" target="_blank" rel="noopener">Itinéraire</a>` : ''}</div>`).join('') : '<p>Aucune aire répertoriée.</p>'}
    <p style="font-size:13px;color:var(--soft);margin:10px 0 0">On n’embarque et ne débarque que sur les aires désignées.</p>
  </section>
  ${t.description ? `<section><h3>Description</h3><div class="desc short" id="desc">${esc(t.description)}</div><button class="link" id="more">Lire tout</button></section>` : ''}
  ${DATA.alertes ? `<section class="alert-box"><h3>Alertes</h3><p style="margin:0 0 10px">Recevez une notification quand ${favs.size ? 'une rivière suivie' : 'un parcours'} ouvre ou ferme : installez l’app gratuite ntfy, puis abonnez-vous.</p><a class="btn" href="${esc(DATA.alertes.url)}" target="_blank" rel="noopener">S’abonner aux alertes</a></section>` : ''}
  <section><a href="https://kayak.spw.wallonie.be/public/home" target="_blank" rel="noopener" class="link">Voir sur Infokayak (site officiel)</a></section>`;
  sh.hidden = false; requestAnimationFrame(() => sh.classList.add('on'));
  sh.scrollTop = 0;
  $('#close').onclick = () => history.state?.sheet ? history.back() : closeSheet();
  $('#close').focus();
  $('#fav').onclick = e => { favs.has(t.id) ? favs.delete(t.id) : favs.add(t.id); store.set('favs', [...favs]); e.target.setAttribute('aria-pressed', favs.has(t.id)); e.target.textContent = favs.has(t.id) ? '★ Suivie' : '☆ Suivre'; render(); };
  const more = $('#more'); if (more) more.onclick = () => { $('#desc').classList.remove('short'); more.remove(); };
  if (layers[t.id]?.getBounds) { const b = layers[t.id].getBounds(); if (b.isValid()) map.fitBounds(b, { padding:[30, 30], maxZoom:13 }); }
  if (push) history.pushState({ sheet:id }, '', '#' + encodeURIComponent(id).replace(/%2D/g,'-'));
}
function closeSheet(){ const sh = $('#sheet'); sh.classList.remove('on'); setTimeout(() => { sh.hidden = true }, 260); }
window.addEventListener('popstate', e => e.state?.sheet ? openSheet(e.state.sheet, false) : closeSheet());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) $('#close').click(); });

// ---------- Données ----------
async function load(){
  let status = 0;
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    status = r.status;
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch {
    $('#maj').textContent = 'Pas de données';
    $('#summary').textContent = 'Impossible de charger les données';
    const why = location.protocol === 'file:'
      ? 'La page est ouverte comme fichier sur votre ordinateur. Elle doit être ouverte depuis son adresse GitHub Pages (https://VOTRE-NOM.github.io/…), où la tâche horaire dépose les données.'
      : status === 404
        ? 'Les données n’ont pas encore été générées. Sur GitHub, ouvrez l’onglet Actions, lancez « Mise à jour des données » et vérifiez qu’elle se termine en vert.'
        : 'Vérifiez votre connexion internet puis rechargez la page.';
    $('#notices').innerHTML = `<div class="notice">${why}</div>`;
    return;
  }
  const d = new Date(DATA.maj), age = (Date.now() - d) / 36e5;
  $('#maj').textContent = 'Mis à jour ' + d.toLocaleString('fr-BE', { weekday:'short', hour:'2-digit', minute:'2-digit' });
  const notes = [];
  if (age > 6) notes.push(`Données vieilles de ${Math.round(age)} h : la mise à jour automatique semble arrêtée.`);
  if (DATA.erreurs?.length) notes.push('Certaines sources n’ont pas répondu (' + DATA.erreurs.map(e => e.split(':')[0]).join(', ') + ') : informations partielles.');
  $('#notices').innerHTML = notes.map(n => `<div class="notice">${esc(n)}</div>`).join('');
  drawMap(); render();
  const h = decodeURIComponent(location.hash.slice(1)); if (h) openSheet(h, false);
}
const setHH = () => document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
setHH(); addEventListener('resize', setHH);
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
