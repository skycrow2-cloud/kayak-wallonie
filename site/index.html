<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kayak Wallonie</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0e1217">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.css">
<style>
/* Charte reprise de GPX 3D : interface sombre en verre, accent orange « balise de sentier », eau en turquoise */
:root{
  --ctl:40px;
  --bg:#0e1217; --panel-solid:rgba(20,25,31,.82); --panel-border:#2a323c; --field-bg:#1b222a;
  --text:#eeeae1; --text-muted:#8b93a1; --muted-2:#5d6672;
  --accent:#e8a33d; --accent-soft:rgba(232,163,61,.16);
  --accent-2:#49b6c4; --accent-2-soft:rgba(73,182,196,.16);
  --warn:#f2c94c; --danger:#d9695f; --ok:#4cc38a;
  --glass:rgba(30,37,48,.48); --glass-hover:rgba(30,37,48,.66); --glass-strong:rgba(27,34,44,.8);
  --glass-border:rgba(232,163,61,.35); --glass-shadow:0 4px 14px rgba(0,0,0,.45);
  --radius:8px; --chart-bg:#1b222a; --chart-grid:#33404b;
  --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --panel-w:380px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font-ui);color:var(--text);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0}

/* ---------- panneau ---------- */
#panel{position:fixed;z-index:3;top:0;left:0;bottom:0;width:var(--panel-w);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel-solid);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-right:1px solid var(--panel-border);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.01em}
.brand .maj{margin-left:auto;font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;text-align:right}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--panel-border);background:var(--field-bg);cursor:pointer}
.chip:hover{border-color:#3a4450}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.summary{font-size:15px;font-weight:600;margin:2px 0 0}
.summary b{color:var(--accent);font-variant-numeric:tabular-nums}
.notice{padding:8px 10px;border-radius:var(--radius);border:1px solid rgba(242,201,76,.4);background:rgba(242,201,76,.1);font-size:12.5px;line-height:1.45}
ul.list{list-style:none;margin:0 -8px;padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 8px;border-radius:var(--radius);cursor:pointer;align-items:center}
.row:hover,.row.hl{background:rgba(255,255,255,.04)}
.row + .row{border-top:1px solid var(--panel-border)}
.row .name{font-size:15px;font-weight:700}
.row .sub{grid-column:1/-1;font-size:12.5px;color:var(--text-muted);line-height:1.4}
.row .gauge{grid-column:1/-1;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ouvert{color:var(--ok)} .s-ferme{color:var(--text-muted)} .s-risque{color:var(--warn)} .s-possible{color:var(--accent-2)} .s-saison{color:var(--muted-2)}

/* jauge : bande turquoise = débits autorisés, curseur orange = débit actuel */
.gauge{position:relative;height:26px}
.gauge .track{position:absolute;left:0;right:0;top:8px;height:8px;border-radius:4px;background:var(--chart-bg);border:1px solid var(--chart-grid)}
.gauge .band{position:absolute;top:8px;height:8px;background:var(--accent-2);opacity:.75;border-radius:2px}
.gauge .mark{position:absolute;top:2px;width:4px;height:20px;margin-left:-2px;background:var(--accent);border-radius:2px;box-shadow:0 0 0 2px rgba(14,18,23,.9)}
.gauge .lab{position:absolute;top:17px;font-size:10.5px;color:var(--text-muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.gauge.big{height:36px}
.gauge.big .track,.gauge.big .band{top:10px;height:12px}
.gauge.big .mark{top:3px;height:26px;width:5px}
.gauge.big .lab{top:25px;font-size:11px}

/* fiche */
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:2px 0;cursor:pointer}
.fiche h2{font-size:22px;margin:4px 0 2px}
.fiche .where{font-size:13px;color:var(--text-muted);margin:0}
.card{border:1px solid var(--panel-border);background:rgba(27,34,42,.55);border-radius:10px;padding:12px}
.card h3{font-size:12.5px;font-weight:600;color:var(--text-muted);margin:0 0 8px}
.big-q{font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0 0}
.big-q small{font-size:14px;color:var(--text-muted);font-weight:500}
.meta{font-size:11.5px;color:var(--text-muted);margin:2px 0 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.stat{display:flex;flex-direction:column;line-height:1.25}
.stat .l{font-size:10.5px;color:var(--text-muted)}
.stat .v{font-size:15px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.day{padding:6px 2px;border-radius:var(--radius);background:var(--field-bg)}
.day .d{font-size:11px;color:var(--text-muted)} .day .i{font-size:20px;line-height:1.4} .day .r{font-size:13px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}
.outlook{margin-top:10px;padding:9px 10px;border-radius:var(--radius);border-left:3px solid var(--accent-2);background:var(--accent-2-soft);font-size:13px}
.outlook.o-ouvert{border-color:var(--ok);background:rgba(76,195,138,.12)} .outlook.o-ferme{border-color:var(--text-muted);background:rgba(139,147,161,.1)} .outlook.o-risque{border-color:var(--warn);background:rgba(242,201,76,.1)}
.outlook small{display:block;color:var(--text-muted);font-size:11.5px;margin-top:3px}
.flow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);margin-top:10px}
.flow svg{flex:none}
.aire{display:flex;gap:9px;align-items:flex-start;padding:8px 0}
.aire + .aire{border-top:1px solid var(--panel-border)}
.aire .t{flex:none;min-width:30px;text-align:center;font-size:11px;font-weight:700;line-height:22px;border-radius:999px;border:1px solid var(--panel-border);color:var(--accent-2)}
.aire .n{flex:1;font-size:13px;cursor:pointer} .aire .n small{display:block;color:var(--text-muted);font-size:11.5px;white-space:pre-line}
.aire a{flex:none;font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none}
.desc{white-space:pre-line;font-size:13px;line-height:1.55;color:#d5d1c8}
.desc.short{max-height:8.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
.link{color:var(--accent);font-weight:600;background:none;border:0;padding:0;cursor:pointer;font-size:13px;text-decoration:none}
svg.spark{width:100%;height:96px;display:block;background:var(--chart-bg);border-radius:6px}
.btn{display:inline-block;font-size:13.5px;font-weight:600;border-radius:var(--radius);padding:8px 12px;text-decoration:none;cursor:pointer;background:var(--accent);color:#231705;border:1px solid var(--accent)}
.star{background:none;border:1px solid var(--panel-border);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted)}
.star[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}

/* ---------- commandes de carte en verre ---------- */
.ctl-stack{position:fixed;z-index:2;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill,.zoom-bar{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.zoom-bar{display:flex;flex-direction:column;width:var(--ctl);border-radius:calc(var(--ctl)/2);overflow:hidden}
.zoom-btn{width:100%;height:calc(var(--ctl) - 2px);border:0;background:transparent;color:var(--accent);font-size:21px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.zoom-btn + .zoom-btn{border-top:1px solid rgba(255,255,255,.12)}
.zoom-btn:hover{background:rgba(232,163,61,.18)}
.pill{width:var(--ctl);height:var(--ctl);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;padding:0;font-size:12px;font-weight:700}
.pill:hover{background:var(--glass-hover)}
#compass svg{transition:transform .1s linear}
.menu{position:relative}
.menu-pop{position:absolute;right:calc(var(--ctl) + 8px);top:0;min-width:170px;padding:6px;border-radius:8px;background:var(--glass-strong);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--glass-border);box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
.menu-pop.open{display:block}
.menu-pop button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 8px;border:0;background:none;border-radius:5px;font-size:12.5px;cursor:pointer;text-align:left}
.menu-pop button:hover{background:rgba(232,163,61,.15)}
.menu-pop button[aria-checked=true]{color:var(--accent)}
.menu-pop hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:4px 0}
#pitch-control{position:fixed;z-index:2;right:10px;bottom:40px;width:var(--ctl);height:130px;border-radius:999px;display:flex;align-items:center;justify-content:center}
#pitch-slider{width:110px;height:22px;transform:rotate(-90deg);accent-color:var(--accent);cursor:pointer}
.maplibregl-ctrl-attrib{font-size:10px;background:transparent!important}
.maplibregl-ctrl-attrib a{color:var(--text-muted);text-shadow:0 1px 3px rgba(0,0,0,.65)}
.maplibregl-ctrl-attrib-button{background-color:rgba(30,37,48,.6)!important;filter:invert(1)}
.maplibregl-ctrl-bottom-right{right:58px}
.lbl{padding:2px 8px;border-radius:10px;background:var(--glass-strong);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--glass-border);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--glass-shadow)}
.lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.maplibregl-popup-content{background:var(--glass-strong);color:var(--text);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;font-size:12.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.maplibregl-popup-tip{display:none}

#panel-toggle{display:none}
@media (max-width:760px){
  :root{--panel-w:100vw}
  #panel{top:auto;height:48dvh;width:100%;border-right:0;border-top:1px solid var(--panel-border);border-radius:14px 14px 0 0;transition:height .2s ease}
  body.panel-small #panel{height:96px;overflow:hidden}
  #panel-toggle{display:flex;position:absolute;left:50%;transform:translateX(-50%);top:4px;width:56px;height:18px;border:0;background:none;padding:0;justify-content:center;cursor:pointer}
  #panel-toggle::before{content:'';width:40px;height:5px;border-radius:3px;background:var(--muted-2)}
  #panel{padding-top:22px}
  #pitch-control{bottom:calc(48dvh + 12px)}
  body.panel-small #pitch-control{bottom:108px}
  .maplibregl-ctrl-bottom-right{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Carte des parcours"></div>

<aside id="panel" aria-label="Parcours">
  <button id="panel-toggle" aria-label="Agrandir ou réduire le panneau"></button>
  <div class="brand"><img src="icon.svg" alt=""><h1>Kayak Wallonie</h1><span class="maj" id="maj">Chargement…</span></div>
  <div id="view-list" style="display:flex;flex-direction:column;gap:12px">
    <div class="filters" role="toolbar" aria-label="Filtres">
      <button class="chip" data-f="ouvert" aria-pressed="false">Ouverts</button>
      <button class="chip" data-f="fav" aria-pressed="false">Mes rivières</button>
      <button class="chip" data-f="pres" aria-pressed="false">Près de moi</button>
    </div>
    <p class="summary" id="summary"></p>
    <div id="notices"></div>
    <ul class="list" id="list"></ul>
  </div>
  <div id="view-fiche" class="fiche" hidden></div>
</aside>

<div class="ctl-stack">
  <div class="zoom-bar"><button class="zoom-btn" id="zin" aria-label="Zoomer">+</button><button class="zoom-btn" id="zout" aria-label="Dézoomer">−</button></div>
  <button class="pill" id="compass" aria-label="Remettre le nord en haut et la carte à plat"><svg width="22" height="22" viewBox="0 0 29 29"><path fill="#e5383b" d="m10.5 14 4-8 4 8h-8z"/><path fill="#d9dde3" d="m10.5 16 4 8 4-8h-8z"/></svg></button>
  <div class="menu">
    <button class="pill" id="basemap-btn" aria-haspopup="true" aria-expanded="false" aria-label="Fond de carte"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <div class="menu-pop" id="basemap-pop" role="menu">
      <button role="menuitemradio" data-bm="aerial">Photo aérienne</button>
      <button role="menuitemradio" data-bm="opentopo">Plan randonnée</button>
      <button role="menuitemradio" data-bm="osm">OpenStreetMap</button>
      <hr>
      <button role="menuitemcheckbox" id="terrain-btn">Relief 3D</button>
    </div>
  </div>
  <button class="pill" id="locate" aria-label="Me localiser"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div id="pitch-control" class="pill" style="border-radius:999px"><input id="pitch-slider" type="range" min="0" max="75" value="0" aria-label="Inclinaison de la vue"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
let DATA = null, me = null, current = null, favs = new Set(store.get('favs', [])), filters = new Set(store.get('filters', []));
const COLORS = { ouvert:'#4cc38a', ferme:'#8b93a1', risque:'#f2c94c', possible:'#49b6c4', saison:'#5d6672' };
const fmt = n => n == null ? '–' : new Intl.NumberFormat('fr-BE', { maximumFractionDigits: n < 10 ? 2 : n < 100 ? 1 : 0 }).format(n);
const ll = p => [p[1], p[0]]; // [lat,lon] -> [lon,lat]

function state(t){
  if (!t.saison) return { k:'saison', label:'Hors saison' };
  if (t.ouvert) return t.prevision?.niveau === 'risque' ? { k:'risque', label:'Ouvert, à surveiller' } : { k:'ouvert', label:'Ouvert' };
  if (t.prevision?.niveau === 'possible') return { k:'possible', label:'Ouverture possible' };
  return { k:'ferme', label:'Fermé' };
}
function reason(t){
  if (!t.saison) return 'Autorisé du 1er octobre au 15 mars';
  if (t.ouvert) return null;
  if (t.debit != null && t.min && t.debit < t.min) return 'Pas assez d’eau';
  if (t.debit != null && t.max && t.debit > t.max) return 'Trop d’eau';
  return t.justif || 'Circulation interdite aujourd’hui';
}
function gauge(t, big){
  if (t.debit == null || !t.min) return '';
  const lo = Math.min(t.debit, t.min) / 2, hi = Math.max(t.debit, t.max || t.min * 4) * 1.3;
  const x = v => (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) * 100;
  const a = x(t.min), b = t.max ? x(t.max) : 100, m = Math.max(1, Math.min(99, x(t.debit)));
  return `<div class="gauge${big ? ' big' : ''}" role="img" aria-label="Débit ${fmt(t.debit)} m³/s, plage autorisée ${fmt(t.min)} à ${fmt(t.max)} m³/s">
    <div class="track"></div><div class="band" style="left:${a}%;width:${b - a}%"></div><div class="mark" style="left:${m}%"></div>
    <span class="lab" style="left:${a}%">min ${fmt(t.min)}</span>${t.max ? `<span class="lab" style="left:${Math.min(b, 92)}%">max ${fmt(t.max)}</span>` : ''}
  </div>`;
}
function spark(t){
  const s = t.serie || []; if (s.length < 3) return '<p class="meta">Pas de mesures horaires disponibles.</p>';
  const W = 600, H = 96, P = 6, vals = s.map(p => p[1]);
  const lo = Math.min(...vals, t.min ?? Infinity) * .9, hi = Math.max(...vals, Math.min(t.max ?? 0, Math.max(...vals) * 2), t.min ?? 0) * 1.08;
  const X = i => P + i / (s.length - 1) * (W - 2 * P), Y = v => H - P - (v - lo) / (hi - lo || 1) * (H - 2 * P);
  const path = s.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const minY = t.min != null && t.min <= hi ? Y(t.min) : null, maxY = t.max != null && t.max <= hi ? Y(t.max) : null;
  const grid = [1, 2, 3].map(k => `<line x1="0" x2="${W}" y1="${H * k / 4}" y2="${H * k / 4}" stroke="#33404b" vector-effect="non-scaling-stroke"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Débit des 7 derniers jours">${grid}
    ${minY != null ? `<rect x="0" y="${maxY ?? 0}" width="${W}" height="${minY - (maxY ?? 0)}" fill="#49b6c4" opacity=".14"/><line x1="0" x2="${W}" y1="${minY}" y2="${minY}" stroke="#49b6c4" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${path} L${X(s.length - 1)} ${H} L${X(0)} ${H}Z" fill="#e8a33d" opacity=".16"/>
    <path d="${path}" fill="none" stroke="#e8a33d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <p class="meta" style="margin-top:6px">7 derniers jours. Bande turquoise : débits autorisés (pointillé = minimum).</p>`;
}
const WX = c => c == null ? '·' : c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌦️' : '⛈️';
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dayName = d => d === todayISO() ? 'Auj.' : new Date(d + 'T12:00').toLocaleDateString('fr-BE', { weekday:'short' });
function distKm(a, b){ const R = 6371, r = Math.PI/180, dl = (b[0]-a[0])*r, dn = (b[1]-a[1])*r; return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2)); }
const start = t => t.trace?.[0] || (a => a ? [a.lat, a.lon] : t.lignes?.[0]?.[0])(t.aires.find(x => x.type === 'E' || x.type === 'ED'));
const shortName = t => t.nom.replace(/^(La|Le|L')\s?[^,]*?(,\s*|\s(?=de |entre |en aval|du |à ))/i, '').replace(/^./, c => c.toUpperCase());

// ---------- Carte (MapLibre, relief 3D comme GPX 3D) ----------
const BASEMAPS = {
  aerial: { tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], maxzoom:19, attribution:'Imagerie © Esri, Maxar, Earthstar Geographics' },
  opentopo: { tiles:['https://a.tile.opentopomap.org/{z}/{x}/{y}.png','https://b.tile.opentopomap.org/{z}/{x}/{y}.png','https://c.tile.opentopomap.org/{z}/{x}/{y}.png'], maxzoom:17, attribution:'© OpenStreetMap, SRTM · Style © OpenTopoMap (CC-BY-SA)' },

// flèche du sens d'écoulement (icône posée le long des lignes)
function arrowImage(){
  const s = 2, w = 22 * s, h = 22 * s, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
  const chev = () => { g.beginPath(); g.moveTo(7*s, 5*s); g.lineTo(15*s, 11*s); g.lineTo(7*s, 17*s); };
  chev(); g.strokeStyle = 'rgba(14,18,23,.85)'; g.lineWidth = 6*s; g.stroke();
  chev(); g.strokeStyle = '#ffffff'; g.lineWidth = 2.6*s; g.stroke();
  return { width:w, height:h, data:g.getImageData(0, 0, w, h).data };
}

function addData(){
  const lines = [], arrows = [], aires = [];
  for (const t of DATA.troncons){
    const st = state(t), props = { id:t.id, color:COLORS[st.k] };
    if (t.trace?.length > 1){
      lines.push({ type:'Feature', properties:props, geometry:{ type:'LineString', coordinates:t.trace.map(ll) } });
      arrows.push({ type:'Feature', properties:props, geometry:{ type:'LineString', coordinates:t.trace.map(ll) } });
    } else if (t.lignes?.length) {
      lines.push({ type:'Feature', properties:props, geometry:{ type:'MultiLineString', coordinates:t.lignes.map(l => l.map(ll)) } });
    }
    for (const a of t.aires) if (a.type !== 'NA') aires.push({ type:'Feature', properties:{ id:t.id, nom:a.nom, type:a.type }, geometry:{ type:'Point', coordinates:[a.lon, a.lat] } });
  }
  map.addSource('rivers', { type:'geojson', data:{ type:'FeatureCollection', features:lines }, lineMetrics:true });
  map.addSource('flow', { type:'geojson', data:{ type:'FeatureCollection', features:arrows } });

function filterMap(shownIds){

}

function bearingOf(a, b){ // cap géographique de a vers b ([lat,lon])
  const r = Math.PI/180, y = Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r), x = Math.cos(a[0]*r)*Math.sin(b[0]*r) - Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const COMPASS = ['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'];

    <a href="https://kayak.spw.wallonie.be/public/home" target="_blank" rel="noopener" class="link">Voir sur Infokayak (site officiel)</a>`;

  $('#fav').onclick = e => { favs.has(t.id) ? favs.delete(t.id) : favs.add(t.id); store.set('favs', [...favs]); e.target.setAttribute('aria-pressed', favs.has(t.id)); e.target.textContent = favs.has(t.id) ? '★ Suivie' : '☆ Suivre'; render(); };
  $('#more')?.addEventListener('click', e => { $('#desc').classList.remove('short'); e.target.remove(); });

function frame(t){
  const pts = t.trace || t.lignes?.flat() || t.aires.map(a => [a.lat, a.lon]); if (!pts?.length) return;
  const b = new maplibregl.LngLatBounds(); pts.forEach(p => b.extend(ll(p)));
  // la rivière « monte » vers le haut de l'écran : on regarde vers l'aval
  const bearing = t.trace?.length > 1 ? bearingOf(t.trace[0], t.trace.at(-1)) : 0;
  map.fitBounds(b, { padding:panelPad(), bearing, pitch:55, maxZoom:14, duration:1600 });
}
function flyAlong(t){
  const tr = t.trace; if (!tr || tr.length < 2) return frame(t);
  // descente caméra le long de la rivière, de l'amont vers l'aval
  const step = Math.max(1, Math.floor(tr.length / 12)); const pts = tr.filter((_, i) => i % step === 0).concat([tr.at(-1)]);
  let i = 0;
  const next = () => {
    if (i >= pts.length - 1 || current !== t.id) return;
    const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)]; i++;
    map.easeTo({ center:ll(a), bearing:bearingOf(a, b), pitch:68, zoom:14, duration:1400, easing:x => x, padding:panelPad() });
    map.once('moveend', next);
  };
  next();
}
function closeFiche(){
  current = null; $('#view-fiche').hidden = true; $('#view-list').hidden = false;
  if (map.getLayer('river-sel')) map.setFilter('river-sel', ['==',['get','id'],'']);
}

// ---------- Données ----------
async function load(){
  let status = 0;
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    status = r.status; if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  } catch {
    $('#maj').textContent = 'Pas de données'; $('#summary').textContent = 'Impossible de charger les données';
    $('#notices').innerHTML = `<div class="notice">${location.protocol === 'file:' ? 'La page est ouverte comme fichier : ouvrez-la depuis son adresse GitHub Pages.' : status === 404 ? 'Les données n’ont pas encore été générées : lancez « Mise à jour des données » dans l’onglet Actions du dépôt.' : 'Vérifiez votre connexion internet puis rechargez la page.'}</div>`;
    return;
  }
  const d = new Date(DATA.maj), age = (Date.now() - d) / 36e5;
  $('#maj').innerHTML = 'Mis à jour<br>' + d.toLocaleString('fr-BE', { weekday:'short', hour:'2-digit', minute:'2-digit' });
  const notes = [];
  if (age > 6) notes.push(`Données vieilles de ${Math.round(age)} h : la mise à jour automatique semble arrêtée.`);
  if (DATA.erreurs?.length) notes.push('Certaines sources n’ont pas répondu (' + DATA.erreurs.map(e => e.split(':')[0]).join(', ') + ') : informations partielles.');
  $('#notices').innerHTML = notes.map(n => `<div class="notice">${esc(n)}</div>`).join('');
  const ready = () => { addData(); render(); const h = decodeURIComponent(location.hash.slice(1)); if (h) openFiche(h, false); };
  // n'attend pas les tuiles (un fond ou le relief indisponible ne doit pas bloquer les rivières)
  let done = false; const go = () => { if (!done && map.isStyleLoaded()) { done = true; ready(); } };
  go(); if (!done) { map.once('style.load', go); map.once('load', go); const iv = setInterval(() => { go(); if (done) clearInterval(iv); }, 200); }
  render();
}
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
